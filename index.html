<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>srssuri</title>
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" id="ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html.cur,html.cur *{cursor:none!important}
body{margin:0;min-height:100svh;background:#0a0a0c;color:#f2f2f4;font-family:"DM Sans",system-ui,sans-serif;display:grid;place-items:center;padding:24px 14px;overflow-x:hidden}
#bg{position:fixed;inset:-20px;z-index:0;background:radial-gradient(60vmax 40vmax at 38% 36%,rgba(255,255,255,.22),transparent 60%),radial-gradient(90vmax 60vmax at 82% 100%,#1c1d21,transparent 70%),linear-gradient(#101114,#050506) center/cover;transform:scale(1.04);transition:transform .25s ease-out;will-change:transform}
#bg video{width:100%;height:100%;object-fit:cover}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.4) 20%,rgba(0,0,0,.84))}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
.stage{position:relative;z-index:2;width:min(640px,100%);display:grid;gap:24px}
.stage>*{animation:rise .85s cubic-bezier(.22,1,.36,1) both}
.stage>*:nth-child(1){animation-delay:.05s}
.stage>*:nth-child(2){animation-delay:.16s}
.stage>*:nth-child(3){animation-delay:.27s}
.stage>*:nth-child(4){animation-delay:.38s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.px{font-family:"Pixelify Sans",monospace}

.id{display:grid;grid-template-columns:auto 1fr;column-gap:20px;align-items:center}
.me{position:relative;width:76px;height:76px}
.me img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#0e0e10;box-shadow:0 0 0 1px rgba(255,255,255,.32),0 0 26px rgba(255,255,255,.16);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s;animation:halo 3.8s ease-in-out infinite}
.me:hover img{transform:scale(1.06) rotate(-2deg);box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 36px rgba(190,150,255,.35)}
@keyframes halo{50%{box-shadow:0 0 0 1px rgba(255,255,255,.45),0 0 34px rgba(180,140,255,.28)}}
.decor span{position:absolute;color:#fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.65));animation:bob 1.6s steps(3) infinite alternate;transition:transform .3s}
.me:hover .decor span{transform:scale(1.2) rotate(12deg)}
.decor svg{display:block;width:100%;height:100%}
.decor span:nth-child(1){left:-18px;top:-12px;width:21px;height:21px}
.decor span:nth-child(2){right:-8px;top:-14px;width:14px;height:14px;animation-delay:-.5s}
.decor span:nth-child(3){left:-10px;bottom:-8px;width:14px;height:14px;animation-delay:-1s}
@keyframes bob{to{transform:translateY(-6px)}}
h1{margin:0;display:flex;align-items:center;gap:10px;font-size:clamp(1.9rem,7vw,2.6rem);font-weight:700;line-height:1.1;text-shadow:0 0 20px rgba(255,255,255,.38)}
.gem{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;background:rgba(150,80,255,.22);border:1px solid rgba(180,120,255,.45);box-shadow:0 0 14px rgba(160,100,255,.3);animation:gemFloat 3s ease-in-out infinite}
@keyframes gemFloat{50%{transform:translateY(-3px) rotate(6deg);box-shadow:0 0 20px rgba(180,120,255,.5)}}
#type{margin:6px 0 0;min-height:1.6em;font-size:1.05rem;color:rgba(255,255,255,.85)}
#type::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;vertical-align:-2px;background:#fff;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.cards{display:grid;grid-template-columns:1fr 1.25fr;gap:14px}
.card{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;min-width:0;color:inherit;text-decoration:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:background .25s,border-color .25s,transform .22s cubic-bezier(.22,1,.36,1),box-shadow .25s;transform-style:preserve-3d;will-change:transform}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.16),transparent 70%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover::before{opacity:1}
.card:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.28);box-shadow:0 12px 30px rgba(0,0,0,.35)}
a:focus-visible,button:focus-visible,#gate:focus-visible{outline:2px solid #fff;outline-offset:3px}
.av,.art{position:relative;width:52px;height:52px;flex:none;background:#000 center/cover;display:grid;place-items:center}
.av{border-radius:50%}.art{border-radius:10px}.art svg{width:28px;height:28px}.art.on svg{display:none}
.dot{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;border:3px solid #17181b;background:#747f8d;transition:background .3s,box-shadow .3s}
.dot.live{animation:pulseDot 2s ease-in-out infinite}
@keyframes pulseDot{50%{box-shadow:0 0 12px currentColor}}
.t{min-width:0}
.t b,.t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t small{color:rgba(255,255,255,.62);font-size:.85rem}

.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.icons{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.icons a{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;opacity:.8;transition:opacity .2s,transform .25s cubic-bezier(.22,1,.36,1),filter .2s,background .2s}
.icons a:hover{opacity:1;transform:translateY(-3px) scale(1.18);filter:drop-shadow(0 0 10px rgba(255,255,255,.65));background:rgba(255,255,255,.08)}
.icons svg{width:22px;height:22px}
.views{justify-self:start;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:.86rem;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .2s,background .2s}
.views:hover{transform:translateY(-1px);background:rgba(255,255,255,.12)}
.views[hidden]{display:none}
.views svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2}

.player{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.player[hidden],#gate[hidden]{display:none}
.player button{width:40px;height:40px;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:1.2rem;cursor:pointer;border-radius:50%;transition:transform .2s,background .2s}
.player button:hover{transform:scale(1.1);background:rgba(255,255,255,.18)}
.pt-row{display:flex;align-items:center;gap:8px}
.pt{font-size:1.1rem}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px;opacity:.35;transition:opacity .2s}
.eq i{display:block;width:2px;height:4px;background:#fff;border-radius:2px}
.player.playing .eq{opacity:1}
.player.playing .eq i{animation:eq .7s ease-in-out infinite alternate}
.player.playing .eq i:nth-child(2){animation-delay:.2s}
.player.playing .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{to{height:12px}}
.prog{display:flex;align-items:center;gap:10px;font-size:.9rem;color:rgba(255,255,255,.75)}
.seek{flex:1;height:16px;display:flex;align-items:center;cursor:pointer}
.seek i{position:relative;display:block;width:100%;height:3px;border-radius:99px;background:rgba(255,255,255,.22)}
.seek b{position:absolute;left:0;top:0;height:100%;width:0;border-radius:99px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}

#gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;font-size:1.5rem;letter-spacing:.03em;cursor:pointer;background:rgba(5,5,6,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:opacity .5s,transform .5s}
#gate.gone{opacity:0;transform:scale(1.03);pointer-events:none}

#curDot,#curRing{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;opacity:0;transition:opacity .2s}
#curDot{width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 20px rgba(180,140,255,.9)}
#curRing{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:1.5px solid rgba(255,255,255,.65);background:rgba(255,255,255,.04);box-shadow:0 0 14px rgba(180,140,255,.25);transition:width .2s,height .2s,margin .2s,border-color .2s,background .2s,opacity .2s}
html.cur.hover #curRing{width:44px;height:44px;margin:-22px 0 0 -22px;border-color:#fff;background:rgba(180,140,255,.16)}
html.cur.down #curRing{width:22px;height:22px;margin:-11px 0 0 -11px}

@media (max-width:560px){.cards{grid-template-columns:1fr}.me{width:64px;height:64px}.bar{grid-template-columns:1fr}.views{justify-self:center;order:2}}
@media (prefers-reduced-motion:reduce){.stage>*,.me img,.decor span,.gem,#type::after,.dot.live,.player.playing .eq i{animation:none!important}.card,.icons a,#bg,#gate{transition:none!important}#curDot,#curRing{display:none!important}}
</style>

const $ = id => document.getElementById(id);
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FINE = matchMedia("(pointer: fine)").matches;
const spotifyUrl = CFG.links.find(l => l.s === "spotify").u;
const discordUrl = CFG.links.find(l => l.s === "discord").u;

document.title = CFG.name;
$("name").textContent = CFG.name;
$("dcN").textContent = CFG.name;
$("me").src = CFG.avatar;
$("ico").href = CFG.avatar;
/* Étoiles 8-bit */
const STAR = ["...X...", "...X...", "..XXX..", "XXXXXXX", ".XXXXX.", ".XX.XX.", ".X...X."];
let sd = ""; STAR.forEach((r, y) => [...r].forEach((c, x) => { if (c === "X") sd += "M" + x + " " + y + "h1v1h-1z"; }));
document.querySelectorAll(".decor span").forEach(s => s.innerHTML = '<svg viewBox="0 0 7 7" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><path d="' + sd + '"/></svg>');
$("dcAv").style.backgroundImage = 'url("' + CFG.avatar + '")';
$("dc").href = discordUrl;
$("sp").href = spotifyUrl;

/* Fond */
if (CFG.bg.video) {
  const v = document.createElement("video");
  Object.assign(v, { src: CFG.bg.video, autoplay: true, muted: true, loop: true, playsInline: true });
  $("bg").prepend(v);
} else if (CFG.bg.image) {
  $("bg").style.background = 'url("' + CFG.bg.image + '") center/cover';
}

/* Icônes */
CFG.links.forEach(l => {
  const a = document.createElement("a");
  a.href = l.u; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.title = l.n; a.setAttribute("aria-label", l.n);
  a.innerHTML = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="' + ICONS[l.s] + '"/></svg>'; $("icons").appendChild(a);
});

/* Texte qui s’écrit tout seul */
let pi = 0, ci = 0, del = false;
function tick() {
  const t = CFG.phrases[pi];
  ci += del ? -1 : 1;
  $("type").textContent = t.slice(0, ci);
  let d = del ? 35 : 75;
  if (!del && ci === t.length) { del = true; d = 1600; }
  else if (del && ci === 0) { del = false; pi = (pi + 1) % CFG.phrases.length; d = 350; }
  setTimeout(tick, d);
}
if (RM) $("type").textContent = CFG.phrases[0]; else tick();

/* Neige + traînée souris & clics */
const cv = $("fx"), cx = cv.getContext("2d");
let W, H; const P = [], SP = [];
function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener("resize", size); size();
for (let i = 0; i < 70; i++) P.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: 1 + Math.random() * 3.2, v: .25 + Math.random() * .6, s: Math.random() * 6.28, a: .25 + Math.random() * .6 });
function spawn(x, y, n, spd) {
  if (RM) return;
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * 6.28, v = (.4 + Math.random()) * spd;
    SP.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - .3, s: 2 + Math.random() * 3, life: 1 });
  }
}

/* Curseur custom + parallaxe + tilt 3D cartes */
let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my, lastSpawn = 0;
if (FINE && !RM) {
  document.documentElement.classList.add("cur");
  const dot = $("curDot"), ring = $("curRing");
  addEventListener("pointermove", e => {
    mx = e.clientX; my = e.clientY;
    dot.style.opacity = ring.style.opacity = "1";
    dot.style.transform = `translate3d(${mx}px,${my}px,0)`;
    $("bg").style.transform = `scale(1.05) translate3d(${(mx / W - .5) * -14}px,${(my / H - .5) * -14}px,0)`;
    const hit = e.target.closest("a,button,#gate,.seek");
    document.documentElement.classList.toggle("hover", !!hit);
    const now = performance.now();
    if (now - lastSpawn > 28) { spawn(mx, my, 1, .9); lastSpawn = now; }
  });
  addEventListener("pointerdown", e => {
    document.documentElement.classList.add("down");
    spawn(e.clientX, e.clientY, 10, 2.4);
  });
  addEventListener("pointerup", () => document.documentElement.classList.remove("down"));
  document.addEventListener("mouseleave", () => { dot.style.opacity = ring.style.opacity = "0"; });
  document.querySelectorAll(".card").forEach(c => {
    c.addEventListener("pointermove", e => {
      const r = c.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      c.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
      c.style.setProperty("--my", (py * 100).toFixed(1) + "%");
      c.style.transform = `perspective(600px) rotateX(${((.5 - py) * 7).toFixed(2)}deg) rotateY(${((px - .5) * 7).toFixed(2)}deg) translateY(-2px)`;
    });
    c.addEventListener("pointerleave", () => { c.style.transform = ""; });
  });
}

function fx() {
  cx.clearRect(0, 0, W, H); cx.strokeStyle = cx.fillStyle = "#fff"; cx.lineWidth = 1;
  for (const p of P) {
    if (!RM) { p.y += p.v; p.s += .01; p.x += Math.sin(p.s) * .35; if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; } }
    cx.globalAlpha = p.a; cx.beginPath();
    if (p.r > 2.4) { for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3, r = p.r * 1.6; cx.moveTo(p.x - Math.cos(a) * r, p.y - Math.sin(a) * r); cx.lineTo(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r); } cx.stroke(); }
    else { cx.arc(p.x, p.y, p.r * .7, 0, 6.28); cx.fill(); }
  }
  for (let i = SP.length - 1; i >= 0; i--) {
    const q = SP[i];
    q.x += q.vx; q.y += q.vy; q.vy += .03; q.life -= .032;
    if (q.life <= 0) { SP.splice(i, 1); continue; }
    cx.globalAlpha = q.life * .75;
    cx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s);
  }
  if (FINE && !RM) {
    rx += (mx - rx) * .18; ry += (my - ry) * .18;
    $("curRing").style.transform = `translate3d(${rx}px,${ry}px,0)`;
  }
  if (!RM) requestAnimationFrame(fx);
}
fx();

/* Discord + Spotify en direct (via Lanyard) */
const COL = { online: "#3ba55d", idle: "#faa61a", dnd: "#ed4245", offline: "#747f8d" };
const LBL = { online: "En ligne", idle: "Absent", dnd: "Ne pas déranger", offline: "Hors ligne" };
async function live() {
  try {
    const j = await (await fetch("https://api.lanyard.rest/v1/users/" + CFG.discordId)).json();
    if (!j.success) throw 0;
    const d = j.data, u = d.discord_user;
    $("dcN").textContent = u.global_name || u.username;
    if (u.avatar) $("dcAv").style.backgroundImage = "url(https://cdn.discordapp.com/avatars/" + u.id + "/" + u.avatar + ".png?size=128)";
    const c = COL[d.discord_status] || COL.offline;
    $("dot").style.background = $("dot").style.color = c;
    $("dot").classList.toggle("live", d.discord_status && d.discord_status !== "offline");
    const game = d.activities.find(a => a.type === 0), cs = d.activities.find(a => a.type === 4);
    $("dcS").textContent = game ? game.name : (cs && cs.state) || LBL[d.discord_status];
    const s = d.listening_to_spotify && d.spotify;
    if (s) {
      $("spArt").style.backgroundImage = "url(" + s.album_art_url + ")"; $("spArt").classList.add("on");
      $("spT").textContent = s.song; $("spS").textContent = "En écoute · " + s.artist;
      $("sp").href = "https://open.spotify.com/track/" + s.track_id;
    } else {
      $("spArt").style.backgroundImage = ""; $("spArt").classList.remove("on");
      $("spT").textContent = "Spotify"; $("spS").textContent = "Voir mon profil"; $("sp").href = spotifyUrl;
    }
  } catch (e) {}
}
live(); setInterval(live, 30000);

/* Compteur de vues (1 fois par navigateur via localStorage) */
(async () => {
  try {
    const sk = "v_" + CFG.views.key;
    let seen = false;
    try { seen = !!localStorage.getItem(sk); } catch (e) {}
    const base = "https://countapi.mileshilliard.com/api/v1/";
    let j = await (await fetch(base + (seen ? "get/" : "hit/") + CFG.views.key)).json();
    if (j.error && seen) j = await (await fetch(base + "hit/" + CFG.views.key)).json();
    try { localStorage.setItem(sk, "1"); } catch (e) {}
    const n = Number(j.value);
    if (isFinite(n)) {
      $("vl").textContent = n > 1 ? "vues" : "vue";
      $("views").hidden = false;
      if (RM || n <= 1) { $("vc").textContent = n.toLocaleString("fr-FR"); }
      else {
        const t0 = performance.now(), dur = 700;
        const step = now => {
          const p = Math.min(1, (now - t0) / dur);
          $("vc").textContent = Math.round(n * (1 - Math.pow(1 - p, 3))).toLocaleString("fr-FR");
          if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }
    }
  } catch (e) {}
})();

/* Lecteur de musique */
if (CFG.music.src) {
  const a = new Audio(CFG.music.src); a.loop = true;
  const fmt = s => isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00";
  $("player").hidden = false; $("gate").hidden = false; $("pt").textContent = CFG.music.title;
  const sync = () => { $("pp").textContent = a.paused ? "▶" : "❚❚"; $("player").classList.toggle("playing", !a.paused); };
  const enter = () => { $("gate").classList.add("gone"); a.play().catch(() => {}); };
  $("gate").addEventListener("click", enter);
  $("gate").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") enter(); });
  $("pp").addEventListener("click", () => { a.paused ? a.play() : a.pause(); });
  a.addEventListener("play", sync); a.addEventListener("pause", sync);
  a.addEventListener("loadedmetadata", () => $("dur").textContent = fmt(a.duration));
  a.addEventListener("timeupdate", () => { $("cur").textContent = fmt(a.currentTime); $("fill").style.width = (a.currentTime / a.duration * 100 || 0) + "%"; });
  $("seek").addEventListener("click", e => { const r = e.currentTarget.getBoundingClientRect(); a.currentTime = (e.clientX - r.left) / r.width * a.duration; });
  $("heart").addEventListener("click", e => { const on = e.currentTarget.getAttribute("aria-pressed") !== "true"; e.currentTarget.setAttribute("aria-pressed", on); e.currentTarget.textContent = on ? "♥" : "♡"; });
}
</script>
